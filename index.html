
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aflatus - Engineering Digital Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'obsidian': '#0B0B0F',
              'charcoal': '#1A1A1F',
              'slate': '#2A2A35',
              'pearl': '#F8F9FA',
              'champagne': '#D4AF37',
              'rose-gold': '#E8B4A6',
              'platinum': '#E5E4E2'
            },
            fontFamily: {
              'serif': ['Playfair Display', 'serif'],
              'sans': ['Inter', 'sans-serif']
            },
            animation: {
              'elegant-reveal': 'elegantReveal 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards',
              'gentle-float': 'gentleFloat 8s ease-in-out infinite',
              'pulse-glow': 'pulseGlow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              elegantReveal: {
                '0%': { opacity: '0', transform: 'translateY(40px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              },
              gentleFloat: {
                '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                '33%': { transform: 'translateY(-10px) rotate(1deg)' },
                '66%': { transform: 'translateY(-5px) rotate(-1deg)' }
              },
              pulseGlow: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)', 'box-shadow': '0 0 5px rgba(212, 175, 55, 0.5)' },
                '50%': { opacity: '0.7', transform: 'scale(0.9)', 'box-shadow': '0 0 15px rgba(212, 175, 55, 0.8)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      /* For custom text gradient */
      .luxury-text {
        background: linear-gradient(135deg, #D4AF37 0%, #E8B4A6 50%, #D4AF37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .ornamental-divider {
          background: linear-gradient(90deg, 
              transparent 0%, 
              rgba(212, 175, 55, 0.3) 20%, 
              rgba(212, 175, 55, 0.6) 50%, 
              rgba(212, 175, 55, 0.3) 80%, 
              transparent 100%);
          height: 1px;
      }
      .elegant-pattern {
        background-image: radial-gradient(circle at 1px 1px, rgba(212, 175, 55, 0.1) 1px, transparent 0);
        background-size: 40px 40px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-obsidian text-pearl antialiased overflow-x-hidden">
    <div id="root"></div>
  </body>
</html>
